<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#1b2433}canvas{display:block}</style>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(1200,420); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x1b2433);
s.add(new THREE.HemisphereLight(0xffffff,0x334455,2.2)); const d=new THREE.DirectionalLight(0xffffff,2); d.position.set(3,5,4); s.add(d);
const cam = new THREE.PerspectiveCamera(30, 1200/420, 0.1, 100);
const view = new URLSearchParams(location.search).get("view") || "side";
const g = await new GLTFLoader().loadAsync("/models/athlete.glb");
const names = new URLSearchParams(location.search).get("clips").split(",");
const t = Number(new URLSearchParams(location.search).get("t") || 0.5);
names.forEach((n,i)=>{
  const c = THREE.SkeletonUtils ? null : null;
});
const { clone } = await import("three/examples/jsm/utils/SkeletonUtils.js");
names.forEach((n,i)=>{
  const m = clone(g.scene);
  m.traverse(o=>{ if(o.isMesh && o.material.name==="Jersey"){o.material=o.material.clone();o.material.color.set(0xff5a4f);} if(o.isMesh && o.material.name==="Shorts"){o.material=o.material.clone();o.material.color.set(0xa8302a);} });
  m.position.x = (i - (names.length-1)/2) * 1.3;
  if (view==="side") m.rotation.y = Math.PI/2;
  if (view==="q") m.rotation.y = Math.PI/4;
  s.add(m);
  const mix = new THREE.AnimationMixer(m);
  const clip = g.animations.find(a=>a.name===n);
  const a = mix.clipAction(clip); a.play(); mix.setTime(clip.duration * t);
});
cam.position.set(0, 1.0, 9.5); cam.lookAt(0,0.85,0);
r.render(s,cam); window.done = true;
</script>
