<!doctype html><html><body style="margin:0"><script type="module">
import * as THREE from "three";
import { Athlete, loadAthlete } from "/src/client/game/three/athlete.ts";
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1f5bff);
sc.add(new THREE.HemisphereLight(0xffffff, 0x303040, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2,4,5); sc.add(d);
const g = new THREE.Mesh(new THREE.PlaneGeometry(20,4), new THREE.MeshStandardMaterial({color:0x222222})); g.rotation.x=-Math.PI/2; sc.add(g);
const tpl = await loadAthlete();
[0, 0.1, 0.2, 0.3, 0.4].forEach((at, i) => { const a = new Athlete(tpl, 0xff3b2f, 0xb0201a, 0xffffff, "00000");
  a.root.position.x = (i - 2) * 1.3; sc.add(a.root);
  a.update({phase:0,run:1,pose:10,at,now:0,mood:"run",heading:Math.PI,h:0,hv:0,airborne:false}, 5, 0.016); });
const cam = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 50); cam.position.set(0, 1.2, 8); cam.lookAt(0, 0.7, 0);
r.render(sc, cam); window.done = true;
</script></body></html>
