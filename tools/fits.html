<!doctype html><html><body style="margin:0;background:#111"><script type="module">
import * as THREE from "three";
import { Athlete, loadAthlete } from "/src/client/game/three/athlete.ts";
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1a2030);
sc.add(new THREE.HemisphereLight(0xffffff, 0x303040, 1.6)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2,4,5); sc.add(d);
const tpl = await loadAthlete();
const fits = (new URLSearchParams(location.search).get("f") || "0000,1111,0101,1010").split(",");
const rot = +(new URLSearchParams(location.search).get("r") || 0);
fits.forEach((f, i) => { const a = new Athlete(tpl, i%2 ? 0x35b8ff : 0xff5a4f, i%2 ? 0x1a6fa3 : 0xa8302a, 0xffffff, f);
  a.root.position.x = (i - (fits.length-1)/2) * 0.8; sc.add(a.root);
  a.update({phase:0,run:0,pose:-1,at:0,now:0,mood:"",heading:Math.PI/2 - rot,h:0,hv:0,airborne:false}, 0, 0.5); });
const cam = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 50);
const zoom = new URLSearchParams(location.search).get("z");
if (zoom) { cam.position.set(0, 1.55, 2.2); cam.lookAt(0, 1.5, 0); } else { cam.position.set(0, 1.0, 6.2); cam.lookAt(0, 0.9, 0); }
r.render(sc, cam); window.done = true;
</script></body></html>
